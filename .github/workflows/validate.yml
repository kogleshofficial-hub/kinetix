name: Validate Kinetix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Static app syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract browser module
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const modules = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
          if (modules.length !== 1) throw new Error('Expected exactly one inline module script.');
          fs.writeFileSync('/tmp/kinetix-module.mjs', modules[0][1]);
          const requiredIds = ['play-keyboard', 'enable-camera', 'calibrate-start', 'game-canvas', 'player-hp', 'enemy-hp', 'pause', 'nova-button'];
          for (const id of requiredIds) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing required DOM element: ' + id);
          }
          console.log('Inline module extracted; required game controls are present.');
          NODE
      - name: Validate JavaScript syntax
        run: node --check /tmp/kinetix-module.mjs
