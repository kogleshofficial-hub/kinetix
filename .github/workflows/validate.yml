name: Validate Kinetix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Static app syntax and DOM references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract browser module and verify DOM
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const modules = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
          if (modules.length !== 1) throw new Error('Expected exactly one inline module script.');
          const source = modules[0][1];
          fs.writeFileSync('/tmp/kinetix-module.mjs', source);
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const idSet = new Set(ids);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate DOM IDs: ' + [...new Set(duplicates)].join(', '));
          const referenced = [...new Set([...source.matchAll(/\$\('([^']+)'\)/g)].map(match => match[1]))];
          const missing = referenced.filter(id => !idSet.has(id));
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          const requiredIds = ['play-keyboard', 'play-duo-camera', 'enable-camera', 'calibrate-start', 'duo-touch-start', 'game-canvas', 'player-hp', 'enemy-hp', 'pause', 'nova-button', 'p1-mana-bar', 'p2-mana-bar', 'pickup-status'];
          for (const id of requiredIds) {
            if (!idSet.has(id)) throw new Error('Missing required element: ' + id);
          }
          console.log('Checked ' + referenced.length + ' DOM references and ' + ids.length + ' unique IDs.');
          NODE
      - name: Validate JavaScript syntax
        run: node --check /tmp/kinetix-module.mjs
