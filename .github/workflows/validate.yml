name: Validate Kinetix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Install, validate and production-build Kinetix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source, DOM references and local runtime configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const source = fs.readFileSync('src/main.js', 'utf8');
          if (!html.includes('<script type="module" src="/src/main.js"></script>')) throw new Error('Vite entry module is not wired into index.html.');
          if (!source.includes("from '@mediapipe/tasks-vision'")) throw new Error('MediaPipe must be imported from the installed package.');
          if (!source.includes("'/mediapipe/wasm'") || !source.includes("'/models/pose_landmarker_lite.task'")) throw new Error('MediaPipe WASM and model must be served from this site.');
          if (source.includes("import('http") || source.includes('import("http')) throw new Error('A runtime CDN module import was found.');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const idSet = new Set(ids);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate DOM IDs: ' + [...new Set(duplicates)].join(', '));
          const referenced = [...new Set([...source.matchAll(/\$\('([^']+)'\)/g)].map(match => match[1]))];
          const missing = referenced.filter(id => !idSet.has(id));
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          const requiredIds = ['play-keyboard','play-duo-camera','enable-camera','calibrate-start','duo-touch-start','game-canvas','player-hp','enemy-hp','pause','nova-button','p1-mana-bar','p2-mana-bar','pickup-status'];
          for (const id of requiredIds) if (!idSet.has(id)) throw new Error('Missing required element: ' + id);

          // Verify distinct Easy / Normal / Hard profiles and a brutal but readable Hard mode.
          const profiles = Object.fromEntries([...source.matchAll(/^\s*(easy|normal|hard):\{([^}]+)\}/gm)].map(match => {
            const values = Object.fromEntries([...match[2].matchAll(/([A-Za-z]+):([0-9.]+)/g)].map(pair => [pair[1], Number(pair[2])]));
            return [match[1], values];
          }));
          if (Object.keys(profiles).sort().join(',') !== 'easy,hard,normal') throw new Error('Solo difficulty profiles must be Easy, Normal and Hard.');
          const hard = profiles.hard;
          if (!(profiles.easy.enemyHP < profiles.normal.enemyHP && profiles.normal.enemyHP < hard.enemyHP)) throw new Error('Rift HP must increase from Easy to Normal to Hard.');
          if (!(profiles.easy.enemyDamage < profiles.normal.enemyDamage && profiles.normal.enemyDamage < hard.enemyDamage)) throw new Error('Rift damage must increase from Easy to Normal to Hard.');
          if (!(hard.enemyHP >= 400 && hard.enemyDamage >= 45 && hard.telegraph <= 0.25 && hard.opening <= 0.4 && hard.recovery <= 0.1)) throw new Error('Hard must keep its high HP, high damage and tight timing profile.');
          const uiDifficulties = [...html.matchAll(/data-difficulty="([^"]+)"/g)].map(match => match[1]).sort().join(',');
          if (uiDifficulties !== 'easy,hard,normal') throw new Error('Difficulty buttons do not match the game profiles.');
          // Static smoke checks for two-player camera/input routing; webcam E2E testing remains manual.
          if (!source.includes("numPoses:cameraTargetMode==='solo'?1:2")) throw new Error('Camera must request two poses for lobby/Duo.');
          if (!source.includes("secondPose=cameraTargetMode==='duo'?(poses[1]||null):null")) throw new Error('Second pose is not assigned in Duo mode.');
          if (!source.includes("if(cameraTargetMode==='duo')detectMotion(secondPose,now,2)")) throw new Error('Player 2 gesture input is not wired.');
          if (!source.includes("cameraTargetMode==='duo'&&!two")) throw new Error('Duo must require both players before calibration.');
          if (!source.includes("if(k==='j')action('PULSE',2)")) throw new Error('Player 2 keyboard backup is not wired.');
          if (!html.includes('data-duo-action="PULSE" data-player="1"') || !html.includes('data-duo-action="PULSE" data-player="2"')) throw new Error('Both split-duel touch controls are required.');
          // Check the local Kinets economy and clear Solo-vs-Duo reward separation.
          for (const item of ['PROFILE_STORAGE_KEY','SOLO_REWARDS','USERNAME_CHANGE_COST','awardSoloWin','handleCharacterAction']) {
            if (!source.includes(item)) throw new Error('Missing economy component: ' + item);
          }
          for (const rate of ["easy:15","normal:20","hard:30"]) if (!source.includes(rate)) throw new Error('Incorrect or missing solo Kinets reward: ' + rate);
          if (!source.includes("if(g.mode!=='solo'||g.rewardGranted)return;")) throw new Error('Solo victory reward must be idempotent and excluded from Duo.');
          if (!source.includes("if(status==='won'&&g.mode==='solo')awardSoloWin()")) throw new Error('Solo victory is not connected to rewards.');
          if (!source.includes("price:120") || !source.includes("price:300") || !source.includes("price:600")) throw new Error('Character style price ladder is missing.');
          if (!html.includes('id="kinet-store"') || !html.includes('id="username-form"') || !html.includes('data-character-action="legendary"')) throw new Error('Kinets shop markup is incomplete.');
          if (!html.includes('LOCAL PILOT') || !html.includes('Duo matches do not pay Kinets.')) throw new Error('Shop must explain local-only profile and Solo-only earning.');
          for (const rate of ["easy:10","normal:20","hard:35"]) if (!source.includes(rate)) throw new Error('Incorrect or missing rank XP reward: ' + rate);
          for (const rank of ['Rift Recruit','Kinetic Initiate','Pulse Adept','Rift Hunter','Void Vanguard','Rift Champion','Kinetix Sovereign']) if (!source.includes(rank)) throw new Error('Missing rank ladder tier: ' + rank);
          for (const component of ['triggerPerfectDefense','checkAdrenaline','LAST_LIGHT','perfectFxUntil','hitStopUntil']) if (!source.includes(component)) throw new Error('Missing skill-feedback mechanic: ' + component);
          for (const item of ['COMBO_BANNERS','handleBannerAction','rank-progress-fill','rank-xp-label']) if (!(source+'\n'+html).includes(item)) throw new Error('Missing rank/banner feature: ' + item);
          if (!source.includes("if(g.mode!=='solo'||g.rewardGranted)return;")) throw new Error('Rewards must be Solo-only and protected from duplicate claims.');
          if (!source.includes("g.mode==='solo'&&g.combo>=5")) throw new Error('Combo banners must only appear from five-hit solo combos.');
          console.log('Validated ' + referenced.length + ' DOM references, ' + ids.length + ' unique DOM IDs, difficulty profiles, Duo input wiring, Kinets wallet, ranks, combo banners and comeback feedback. Duo webcam behavior still requires manual testing.');
          NODE
      - name: Validate JavaScript syntax
        run: node --check src/main.js
      - name: Build production app and local assets
        run: npm run build
      - name: Verify deployable output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          if (!fs.existsSync('dist/index.html')) throw new Error('dist/index.html is missing.');
          const assets = fs.readdirSync('dist/assets');
          const js = assets.filter(name => name.endsWith('.js'));
          if (!js.length) throw new Error('Vite did not output a bundled JavaScript entry.');
          const wasmDir = 'dist/mediapipe/wasm';
          if (!fs.existsSync(wasmDir)) throw new Error('Bundled MediaPipe WASM folder is missing.');
          const walk = dir => fs.readdirSync(dir, {withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(path.join(dir,entry.name)) : [path.join(dir,entry.name)]);
          const files = walk(wasmDir);
          if (!files.some(file => file.endsWith('.wasm')) || !files.some(file => file.endsWith('.js'))) throw new Error('MediaPipe runtime files are incomplete.');
          if (!fs.existsSync('dist/models/pose_landmarker_lite.task') || fs.statSync('dist/models/pose_landmarker_lite.task').size < 1000000) throw new Error('Local pose model is missing or invalid.');
          const bundles = js.map(name => fs.readFileSync(path.join('dist/assets',name),'utf8')).join('\n');
          if (bundles.includes('esm.sh/@mediapipe/tasks-vision') || bundles.includes('@mediapipe/tasks-vision@0.10.22/+esm')) throw new Error('Production bundle still references remote MediaPipe module CDNs.');
          console.log('Production output verified: bundled JS, local WASM runtime and local pose model.');
          NODE
