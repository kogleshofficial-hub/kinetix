name: Validate Kinetix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Install, validate and production-build Kinetix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source, DOM references and local runtime configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const source = fs.readFileSync('src/main.js', 'utf8');
          if (!html.includes('<script type="module" src="/src/main.js"></script>')) throw new Error('Vite entry module is not wired into index.html.');
          if (!source.includes("from '@mediapipe/tasks-vision'")) throw new Error('MediaPipe must be imported from the installed package.');
          if (!source.includes("'/mediapipe/wasm'") || !source.includes("'/models/pose_landmarker_lite.task'")) throw new Error('MediaPipe WASM and model must be served from this site.');
          if (/import\\s*\\(\\s*['"]https?:/.test(source)) throw new Error('A runtime CDN module import was found.');
          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(match => match[1]);
          const idSet = new Set(ids);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate DOM IDs: ' + [...new Set(duplicates)].join(', '));
          const referenced = [...new Set([...source.matchAll(/\\$\\('([^']+)'\\)/g)].map(match => match[1]))];
          const missing = referenced.filter(id => !idSet.has(id));
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          const requiredIds = ['play-keyboard','play-duo-camera','enable-camera','calibrate-start','duo-touch-start','game-canvas','player-hp','enemy-hp','pause','nova-button','p1-mana-bar','p2-mana-bar','pickup-status'];
          for (const id of requiredIds) if (!idSet.has(id)) throw new Error('Missing required element: ' + id);
          console.log('Validated ' + referenced.length + ' DOM references and ' + ids.length + ' unique DOM IDs.');
          NODE
      - name: Validate JavaScript syntax
        run: node --check src/main.js
      - name: Build production app and local assets
        run: npm run build
      - name: Verify deployable output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          if (!fs.existsSync('dist/index.html')) throw new Error('dist/index.html is missing.');
          const assets = fs.readdirSync('dist/assets');
          const js = assets.filter(name => name.endsWith('.js'));
          if (!js.length) throw new Error('Vite did not output a bundled JavaScript entry.');
          const wasmDir = 'dist/mediapipe/wasm';
          if (!fs.existsSync(wasmDir)) throw new Error('Bundled MediaPipe WASM folder is missing.');
          const walk = dir => fs.readdirSync(dir, {withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(path.join(dir,entry.name)) : [path.join(dir,entry.name)]);
          const files = walk(wasmDir);
          if (!files.some(file => file.endsWith('.wasm')) || !files.some(file => file.endsWith('.js'))) throw new Error('MediaPipe runtime files are incomplete.');
          if (!fs.existsSync('dist/models/pose_landmarker_lite.task') || fs.statSync('dist/models/pose_landmarker_lite.task').size < 1000000) throw new Error('Local pose model is missing or invalid.');
          const bundles = js.map(name => fs.readFileSync(path.join('dist/assets',name),'utf8')).join('\\n');
          if (bundles.includes('esm.sh/@mediapipe/tasks-vision') || bundles.includes('@mediapipe/tasks-vision@0.10.22/+esm')) throw new Error('Production bundle still references remote MediaPipe module CDNs.');
          console.log('Production output verified: bundled JS, local WASM runtime and local pose model.');
          NODE
