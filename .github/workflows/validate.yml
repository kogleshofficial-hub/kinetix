name: Validate Kinetix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Test, validate and production-build Kinetix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/creator.js
          node --check src/engine/EventBus.js
          node --check src/engine/motion/KinetixMotionEngine.js
          node --check src/engine/motion/KinetixMotionMath.js
          node --check src/engine/motion/motion.worker.js
          node --check src/engine/combat/KinetixCombatDirector.js
          node --check src/engine/progression/KinetixProgressionVault.js
          node --check src/engine/viewport/KinetixViewportCanvas.js
          node --check src/engine/platform/KinetixPWA.js
          node --check src/engine/challenge/KinetixDailyChallenge.js
          node --check src/engine/challenge/DailyRiftRecords.js
          node --check public/sw.js
          node --check scripts/obfuscate-build.mjs
      - name: Unit tests
        run: npm test
      - name: Validate game integration, DOM references and engine contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          if (/<a\b[^>]*\bhref\s*=\s*["']https?:\/\//i.test(html)) throw new Error('External website links are not allowed in the Y8-facing game page.');
          if (html.includes('youtube.com') || html.includes('creator-youtube') || html.includes('creator-launch')) throw new Error('Creator promotion/development links must not appear in the Y8-facing game page.');
          if (html.includes('fonts.googleapis.com') || html.includes('fonts.gstatic.com')) throw new Error('Game page must not depend on externally hosted web fonts.');
          const source = fs.readFileSync('src/main.js', 'utf8');
          const motion = fs.readFileSync('src/engine/motion/KinetixMotionEngine.js', 'utf8');
          const worker = fs.readFileSync('src/engine/motion/motion.worker.js', 'utf8');
          const director = fs.readFileSync('src/engine/combat/KinetixCombatDirector.js', 'utf8');
          const vault = fs.readFileSync('src/engine/progression/KinetixProgressionVault.js', 'utf8');
          const viewport = fs.readFileSync('src/engine/viewport/KinetixViewportCanvas.js', 'utf8');
          const bus = fs.readFileSync('src/engine/EventBus.js', 'utf8');
          const css = fs.readFileSync('src/engine/viewport/kinetix-viewport.css', 'utf8');
          const pwa = fs.readFileSync('src/engine/platform/KinetixPWA.js', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          const serviceWorker = fs.readFileSync('public/sw.js', 'utf8');

          if (!html.includes('<script type="module" src="/src/main.js"></script>')) throw new Error('Vite game entry is not wired into index.html.');
          if (!html.includes('<link rel="manifest" href="/manifest.webmanifest">') || !pwa.includes("register('/sw.js'")) throw new Error('Installable PWA manifest/service-worker registration is missing.');
          if (!manifest.icons.some(icon => icon.sizes === '192x192' && icon.type === 'image/png') || !manifest.icons.some(icon => icon.sizes === '512x512' && icon.type === 'image/png')) throw new Error('PWA 192px and 512px icons are missing.');
          if (!serviceWorker.includes("request.method !== 'GET'") || !serviceWorker.includes("url.origin !== self.location.origin") || !serviceWorker.includes("path.startsWith('/models/')") || !serviceWorker.includes("path.startsWith('/mediapipe/wasm/')") || !serviceWorker.includes("const CACHE_VERSION = 'kinetix-3.0.0'")) throw new Error('Offline cache must be same-origin, versioned, GET-only and include local motion assets.');
          const bootTail = source.slice(source.lastIndexOf("window.addEventListener('beforeunload'"));
          if (bootTail.includes("void startCamera('lobby')") || !source.includes("$('gate-retry').addEventListener('click',()=>{void startCamera(cameraTargetMode);});")) throw new Error('Camera must start from the explicit consent button, not during page boot.');
          if (!source.includes("$('enable-camera').addEventListener('click',()=>{void startCamera(cameraTargetMode);});") || !source.includes('CAMERA OFF · WAITING FOR YOUR PERMISSION')) throw new Error('Camera retry or consent status is missing.');
          if (!html.includes('id="gate-skip"') || !html.includes('id="play-keyboard"') || !html.includes('id="play-camera"') || !html.includes('id="play-duo-touch"')) throw new Error('Camera-optional input routes are missing.');
          if (!source.includes("function startSoloWithoutCamera(dailyChallenge=null)") || !source.includes("function startTouchDuel()") || !source.includes("function continueWithoutCamera()")) throw new Error('Non-camera solo/duo entry points are missing.');
          if (!source.includes("$('play-camera').addEventListener('click',()=>chooseGameMode('solo'));") || !source.includes("$('play-duo-camera').addEventListener('click',()=>chooseGameMode('duo'));")) throw new Error('Camera motion must remain an explicit opt-in action.');
          if (!source.includes("startSoloWithoutCamera(createDailyChallenge())") || !source.includes("chooseGameMode('solo',createDailyChallenge())")) throw new Error('Daily Rift must support keyboard/touch and camera modes.');
          if (source.includes("from '@mediapipe/tasks-vision'")) throw new Error('MediaPipe inference must not be imported into the window thread.');
          if (!worker.includes("from '@mediapipe/tasks-vision'")) throw new Error('The dedicated worker must own MediaPipe inference.');
          if (!motion.includes("new Worker(new URL('./motion.worker.js', import.meta.url)")) throw new Error('Motion engine worker URL is not wired.');
          const viteConfig = fs.readFileSync('vite.config.js', 'utf8');
          if (!motion.includes("type: 'classic'") || !viteConfig.includes("worker: { format: 'iife' }")) throw new Error('MediaPipe must run in a classic worker so its WASM loader can register ModuleFactory through importScripts().');
          if (worker.includes('installModuleWorkerDynamicImport')) throw new Error('The module-worker import shim must not be used with MediaPipe WASM.');
          if (!source.includes("'/mediapipe/wasm'") || !source.includes("'/models/pose_landmarker_lite.task'")) throw new Error('Local MediaPipe model/runtime paths are missing.');
          if (!worker.includes("delegate: 'GPU'") || !worker.includes("delegate: 'CPU'")) throw new Error('GPU with CPU fallback is required.');
          if (!worker.includes('smoothLandmarks') || !worker.includes(': 0.62') || !worker.includes('index === 13')) throw new Error('Motion smoothing is missing.');
          const motionMath = fs.readFileSync('src/engine/motion/KinetixMotionMath.js', 'utf8');
          const dailyChallenge = fs.readFileSync('src/engine/challenge/KinetixDailyChallenge.js', 'utf8');
          const dailyRecords = fs.readFileSync('src/engine/challenge/DailyRiftRecords.js', 'utf8');
          if (!worker.includes('detectRaisedHand') || !motionMath.includes('export function detectRaisedHand') || !worker.includes("gestureType: 'RAISED_HAND'")) throw new Error('Raised-hand camera control is not connected.');
          if (worker.includes('detectArmPulse') || worker.includes('FORWARD_REACH')) throw new Error('Forward-reach gesture activation must remain disabled.');
          if (!source.includes('details=null') || !director.includes('normalizeActionDetails') || !director.includes('pulseStyle')) throw new Error('Camera action metadata normalization is missing.');
          if (!dailyChallenge.includes('export function createDailyChallenge') || !dailyChallenge.includes('export function selectDailyLane') || !source.includes('selectDailyLane(()=>combatDirector.random(),g.target)')) throw new Error('Daily Rift seed and deterministic lane selection are not wired.');
          if (!dailyRecords.includes('export class DailyRiftRecords') || !source.includes('dailyRiftRecords.record(g.dailyChallenge') || !source.includes('dailyRiftRecords.get(challenge.date)')) throw new Error('Local Daily Rift personal records are not integrated.');
          if (!html.includes('id="play-daily"') || !html.includes('id="daily-challenge-date"') || !html.includes('id="daily-challenge-record"') || !source.includes("beginMatch(g.dailyChallenge?{seed:g.dailyChallenge.seed}:undefined)")) throw new Error('Daily Rift lobby controls or seeded match start are missing.');
          if (!source.includes('REPLAY DAILY RIFT') || !source.includes('DAILY RIFT · '+'')) throw new Error('Daily Rift replay/share-card support is missing.');
          if (!worker.includes('high: Object.freeze') || !worker.includes('max: Object.freeze')) throw new Error('HIGH and MAX sensitivity profiles are missing.');
          if (!worker.includes('requiredPlayerCount') || !worker.includes("message.type === 'CONFIG'")) throw new Error('Lobby/Solo/Duo pose-count configuration is missing.');
          if (!worker.includes("emitAction('GUARD_RELEASE'")) throw new Error('Guard release handling is missing.');
          if (!worker.includes('PHASE_LEFT') || !worker.includes('PHASE_RIGHT')) throw new Error('Camera lane-change actions are missing.');
          if (!motion.includes('requestVideoFrameCallback') || !motion.includes('createImageBitmap(this.video)')) throw new Error('Video frames are not transferred asynchronously to the worker.');
          if (!motion.includes('GUARD_RELEASE') || !motion.includes("arrowleft: ['PHASE_LEFT', 2]")) throw new Error('Keyboard fallback and guard-release events are missing.');
          if (!director.includes('stepSeconds = 1 / tickRate') || !director.includes('setTimeout(pump') || !director.includes('maxCatchUpTicks')) throw new Error('Dedicated fixed-step simulation scheduler is missing.');
          if (!director.includes('MATCH_START') || !director.includes('TIME_CRITICAL') || !director.includes('MATCH_OVER')) throw new Error('Combat lifecycle states are incomplete.');
          if (!director.includes('Object.freeze') || !bus.includes('Object.freeze')) throw new Error('Read-only combat/event snapshots are missing.');
          if (!source.includes('tickRate: 60') || !source.includes('combatDirector.beginMatch(')) throw new Error('Main game does not start the 60 Hz simulation director.');
          if (!source.includes("isEnabled:()=>g.status==='playing'&&!paused&&(!cameraMode||trackingOkay)")) throw new Error('Simulation pause and lost-tracking gates are missing.');
          if (source.includes('combatDirector.advance(')) throw new Error('The render loop must not drive the simulation clock.');
          if (!source.includes("document.addEventListener('visibilitychange'") || !source.includes("window.addEventListener('blur'") || !source.includes('audioContext.suspend()')) throw new Error('Page-visibility pause and audio mute are missing.');
          if (!source.includes("if(!paused&&!arena.classList.contains('hidden')&&g.status==='playing')pauseGame();")) throw new Error('Repeated focus-loss events must not reopen the pause dialog.');
          if (!source.includes("if(soundOn&&audioContext&&audioContext.state==='suspended')audioContext.resume().catch(()=>{})")) throw new Error('Resume must restore audio from the player interaction while respecting mute settings.');
          if (!source.includes('viewport.render(t)') || !source.includes('viewport.connect(combatDirector.bus)')) throw new Error('Viewport effects are not connected to the game event bus.');
          if (!source.includes('scaleX(') || !css.includes('translate3d')) throw new Error('Transform-based HUD/viewport styling is missing.');
          if (!vault.includes('client-local-unverified') || !vault.includes('signature: null')) throw new Error('Local receipts must be explicitly marked unverified.');
          if (!vault.includes('_remoteTransaction') || !vault.includes('If-Match')) throw new Error('Cloud transaction/version-conflict adapter hooks are missing.');
          if (!vault.includes("easy: Object.freeze({ kinets: 15, xp: 10 })") || !vault.includes("normal: Object.freeze({ kinets: 20, xp: 20 })") || !vault.includes("hard: Object.freeze({ kinets: 30, xp: 35 })")) throw new Error('Solo Kinets/XP reward table is incorrect.');
          if (!source.includes("if(g.mode!=='solo'||g.rewardGranted)return;")) throw new Error('Solo victory rewards must be idempotent and excluded from Duo.');
          if (!source.includes("if(status==='won'&&g.mode==='solo')")) throw new Error('Solo victory reward handler is not wired.');
          if (!source.includes('PROFILE_STORAGE_KEY') || !source.includes('USERNAME_CHANGE_COST') || !source.includes('handleCharacterAction')) throw new Error('Profile/store integration is missing.');
          if (!source.includes('price:120') || !source.includes('price:300') || !source.includes('price:600')) throw new Error('Character price ladder is missing.');
          for (const rank of ['Rift Recruit','Kinetic Initiate','Pulse Adept','Rift Hunter','Void Vanguard','Rift Champion','Kinetix Sovereign']) if (!source.includes(rank)) throw new Error('Missing rank: ' + rank);
          for (const feature of ['triggerPerfectDefense','checkAdrenaline','perfectFxUntil','hitStopUntil']) if (!source.includes(feature)) throw new Error('Existing game feature was lost: ' + feature);
          if (!motion.includes('LAST_LIGHT')) throw new Error('Existing LAST_LIGHT keyboard control was lost.');
          for (const feature of ['COMBO_BANNERS','rank-progress-fill','rank-xp-label','UNSTOPPABLE','RIFT BREAKER']) if (!(source+html).includes(feature)) throw new Error('Rank/banner feature was lost: ' + feature);

          const ids = html.split('id="').slice(1).map(part => part.split('"', 1)[0]);
          const idSet = new Set(ids);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate DOM IDs: ' + [...new Set(duplicates)].join(', '));
          const referenced = [...new Set(source.split("$('").slice(1).map(part => part.split("')", 1)[0]))];
          const missing = referenced.filter(id => !idSet.has(id));
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          if (!html.includes('data-duo-action="PULSE" data-player="1"') || !html.includes('data-duo-action="PULSE" data-player="2"')) throw new Error('Split-duel touch fallback controls are missing.');
          if (!html.includes('CONTROLLED HAND RAISE') || html.includes('JAB FORWARD')) throw new Error('Camera guide must describe low-impact gesture input.');
          console.log('Validated worker isolation, split-player tracking, fixed-tick lifecycle, wallet contracts, HUD wiring and ' + referenced.length + ' DOM references.');
          NODE
      - name: Validate Creator Studio
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('creator.html', 'utf8');
          const source = fs.readFileSync('src/creator.js', 'utf8');
          if (!html.includes('<script type="module" src="/src/creator.js"></script>')) throw new Error('Creator Studio module is not connected.');
          const ids = html.split('id="').slice(1).map(part => part.split('"', 1)[0]);
          for (const id of ['project-name','gesture','rule','goal','duration','difficulty','theme','countdown','sound','preview-canvas','start-test','reset-test','save-draft','export-button','import-button','import-file','toast']) {
            if (!ids.includes(id)) throw new Error('Creator Studio is missing required DOM ID: ' + id);
          }
          if (!source.includes('kinetix-creator-draft-v1') || !source.includes('kinetix-motion-blueprint')) throw new Error('Creator Studio local draft/blueprint format is missing.');
          if (!source.includes('function exportBlueprint') || !source.includes('async function importBlueprint')) throw new Error('Blueprint export/import is missing.');
          if (/getUserMedia|PoseLandmarker|detectForVideo/.test(source)) throw new Error('Creator Studio must not request or process camera frames.');
          if (!html.includes('CAMERA IS NOT USED IN THIS EDITOR')) throw new Error('Creator Studio camera scope message is missing.');
          if (!html.includes('<link rel="manifest" href="/manifest.webmanifest">') || !source.includes('setupKinetixPWA')) throw new Error('Creator Studio PWA support is not connected.');
          NODE
      - name: Build production app and local camera assets
        run: npm run build
      - name: Verify deployable output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dist = path.resolve('dist');
          const assetDir = path.join(dist, 'assets');
          if (!fs.existsSync(path.join(dist, 'index.html'))) throw new Error('dist/index.html is missing.');
          if (!fs.existsSync(path.join(dist, 'sw.js'))) throw new Error('Production service worker is missing.');
          if (!fs.existsSync(path.join(dist, 'manifest.webmanifest'))) throw new Error('Production PWA manifest is missing.');
          for (const icon of ['kinetix-192.png','kinetix-512.png','kinetix.svg']) if (!fs.existsSync(path.join(dist,'icons',icon))) throw new Error('Production PWA icon is missing: ' + icon);
          const builtManifest = JSON.parse(fs.readFileSync(path.join(dist,'manifest.webmanifest'),'utf8'));
          if (builtManifest.start_url !== '/' || builtManifest.scope !== '/') throw new Error('PWA manifest scope/start URL is invalid.');
          if (!fs.existsSync(assetDir)) throw new Error('dist/assets is missing.');
          const assets = fs.readdirSync(assetDir);
          const js = assets.filter(name => name.endsWith('.js'));
          const workerFiles = js.filter(name => name.includes('motion.worker') || name.includes('worker-'));
          if (!workerFiles.length) throw new Error('The camera motion worker was not emitted as a separate bundle.');
          if (js.some(name => name.endsWith('.map'))) throw new Error('Production source maps were emitted.');
          const wasmDir = path.join(dist, 'mediapipe', 'wasm');
          if (!fs.existsSync(wasmDir)) throw new Error('Bundled MediaPipe WASM folder is missing.');
          const walk = dir => fs.readdirSync(dir, {withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(path.join(dir,entry.name)) : [path.join(dir,entry.name)]);
          const wasmFiles = walk(wasmDir);
          if (!wasmFiles.some(file => file.endsWith('.wasm')) || !wasmFiles.some(file => file.endsWith('.js'))) throw new Error('MediaPipe runtime files are incomplete.');
          const model = path.join(dist, 'models', 'pose_landmarker_lite.task');
          if (!fs.existsSync(model) || fs.statSync(model).size < 1000000) throw new Error('Local pose model is missing or invalid.');
          for (const name of js) {
            const code = fs.readFileSync(path.join(assetDir,name),'utf8');
            if (code.includes('sourceMappingURL=')) throw new Error('Production source maps are referenced by ' + name);
            if (code.includes('esm.sh/@mediapipe/tasks-vision')) throw new Error('Runtime MediaPipe CDN import was found in ' + name);
          }
          console.log('Verified app entry points, separate worker bundle, local WASM/model assets and disabled source maps.');
          NODE
      - name: Verify crawler files
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
