<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-label="A futuristic megacity split by a luminous energy rift">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101d2e"/><stop offset=".37" stop-color="#465a69"/><stop offset=".64" stop-color="#b17d68"/><stop offset="1" stop-color="#17232a"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ffd5a3" stop-opacity=".9"/><stop offset=".28" stop-color="#f0a77e" stop-opacity=".42"/><stop offset="1" stop-color="#e58e77" stop-opacity="0"/></radialGradient>
 <linearGradient id="rift" x2="0" y2="1"><stop stop-color="#d9ffff" stop-opacity=".18"/><stop offset=".25" stop-color="#b9ffeb" stop-opacity=".95"/><stop offset=".5" stop-color="#dcfff8"/><stop offset=".72" stop-color="#8df7d7"/><stop offset="1" stop-color="#aaffdf" stop-opacity=".06"/></linearGradient>
 <linearGradient id="tower" x2="1" y2="0"><stop stop-color="#0b1822"/><stop offset=".42" stop-color="#1c303a"/><stop offset=".7" stop-color="#101d27"/><stop offset="1" stop-color="#07121a"/></linearGradient>
 <linearGradient id="towerLit" x2="0" y2="1"><stop stop-color="#49606a"/><stop offset=".3" stop-color="#233a45"/><stop offset="1" stop-color="#09151d"/></linearGradient>
 <linearGradient id="street" x2="0" y2="1"><stop stop-color="#1a3036"/><stop offset="1" stop-color="#040b11"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="strong"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="windows" width="24" height="31" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="5" height="12" fill="#a9d8d0" opacity=".34"/><rect x="15" y="6" width="4" height="12" fill="#d9ad8c" opacity=".24"/></pattern>
 <pattern id="tiny" width="15" height="21" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="3" height="8" fill="#b2d9d3" opacity=".34"/></pattern>
 <linearGradient id="vignette" x2="0" y2="1"><stop stop-color="#02080d" stop-opacity=".08"/><stop offset=".52" stop-color="#02080d" stop-opacity="0"/><stop offset="1" stop-color="#02080d" stop-opacity=".92"/></linearGradient>
</defs>
